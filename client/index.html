<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickVault</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="app">

  <!-- ════ SIDEBAR ════════════════════════════════════════════════════════ -->
  <aside id="sidebar">
    <!-- Logo -->
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark">Q</div>
      QuickVault
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- Rendered by app.js -->
    </nav>

    <!-- Tags -->
    <div class="sidebar-section-label">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6Z"/></svg>
      Tags
    </div>
    <div class="tag-cloud" id="tag-cloud"><!-- Rendered by app.js --></div>

    <!-- Seed -->
    <div style="padding:0 8px;margin-top:8px">
      <button class="seed-btn" id="seed-btn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z"/></svg>
        Load Sample Data
      </button>
    </div>

    <!-- User footer -->
    <div class="sidebar-footer">
      <img class="user-avatar"
        src="https://api.dicebear.com/8.x/initials/svg?seed=Demo%20User"
        alt="User avatar" />
      <div class="user-info">
        <div class="user-name">Demo User</div>
        <div class="user-email">demo@quickvault.dev</div>
      </div>
    </div>
  </aside>

  <!-- ════ MAIN ════════════════════════════════════════════════════════════ -->
  <div id="main">

    <!-- Header -->
    <header id="header">
      <button class="btn-icon mobile-menu-btn" id="mobile-menu" aria-label="Menu">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:18px;height:18px"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
      </button>

      <div class="search-bar" id="search-bar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
        <input id="search-input" class="search-bar-input" type="text" placeholder="Search items, tags, code..." />
        <kbd class="search-kbd">⌘K</kbd>
      </div>

      <div class="header-actions">
        <div class="view-toggle">
          <button class="view-btn active" id="view-grid" title="Grid view">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z"/></svg>
          </button>
          <button class="view-btn" id="view-list" title="List view">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>
          </button>
        </div>

        <button class="header-btn-icon" id="theme-btn" title="Toggle theme">
          <!-- Rendered by app.js -->
        </button>

        <button class="btn-primary" id="add-item-btn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:14px;height:14px"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          New Item
        </button>
      </div>
    </header>

    <!-- Canvas -->
    <div id="canvas">
      <div class="canvas-inner">

        <!-- Canvas header row -->
        <div class="canvas-header">
          <div>
            <h2 class="canvas-title" id="canvas-title">
              All Items <span class="canvas-count" id="canvas-count">0</span>
            </h2>
            <p class="canvas-subtitle" id="canvas-sub">Organize and access your bookmarks, snippets, and notes</p>
          </div>
          <div class="canvas-quick-actions">
            <span id="filter-pills"></span>
            <button class="btn-secondary" id="qa-bookmark">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:12px;height:12px"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
              Bookmark
            </button>
            <button class="btn-secondary" id="qa-snippet">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:12px;height:12px"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
              Snippet
            </button>
            <button class="btn-secondary" id="qa-note">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:12px;height:12px"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
              Note
            </button>
          </div>
        </div>

        <!-- Item cards container -->
        <div id="canvas-items" class="cards-grid"></div>

        <!-- Empty state -->
        <div id="empty-state" class="hidden">
          <div class="empty-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 13.5h3.86a2.25 2.25 0 0 1 2.012 1.244l.256.512a2.25 2.25 0 0 0 2.013 1.244h3.218a2.25 2.25 0 0 0 2.013-1.244l.256-.512a2.25 2.25 0 0 1 2.013-1.244h3.859m-19.5.338V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 0 0-2.15-1.588H6.911a2.25 2.25 0 0 0-2.15 1.588L2.1 13.177a2.25 2.25 0 0 0-.1.661Z"/></svg>
          </div>
          <h3>Vault is empty</h3>
          <p>Save web links, code snippets, or markdown notes to build your personal library.</p>
          <div class="empty-actions">
            <button class="btn-primary" id="empty-add">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:14px;height:14px"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
              Add Item
            </button>
            <button class="btn-secondary" id="empty-seed">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:12px;height:12px"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/></svg>
              Load Sample Data
            </button>
          </div>
        </div>

      </div><!-- /canvas-inner -->
    </div><!-- /canvas -->

  </div><!-- /main -->

</div><!-- /app -->

<!-- ════ MODALS ════════════════════════════════════════════════════════════ -->

<!-- Add Item Modal -->
<div class="modal-overlay hidden" id="add-overlay">
  <div class="modal" id="add-modal"><!-- Built by modals.js --></div>
</div>

<!-- Edit Item Modal -->
<div class="modal-overlay hidden" id="edit-overlay">
  <div class="modal" id="edit-modal"><!-- Built by modals.js --></div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay hidden" id="detail-overlay">
  <div class="modal modal-detail" id="detail-modal"><!-- Built by modals.js --></div>
</div>

<!-- ════ CMD+K PALETTE ════════════════════════════════════════════════════ -->
<div id="cmd-overlay" class="hidden">
  <div class="cmd-box">
    <div class="cmd-input-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
      <input id="cmd-input" class="cmd-input" type="text" placeholder="Search or run a command..." autocomplete="off" />
      <kbd class="cmd-esc">ESC</kbd>
    </div>

    <div class="cmd-quick">
      <div class="cmd-section-label">Quick Actions</div>
      <div class="cmd-quick-grid">
        <button class="cmd-quick-action" data-cmd-bookmark>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:12px;height:12px"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Bookmark
        </button>
        <button class="cmd-quick-action" data-cmd-snippet>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:12px;height:12px"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Snippet
        </button>
        <button class="cmd-quick-action" data-cmd-note>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:12px;height:12px"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Note
        </button>
        <button class="cmd-quick-action" data-cmd-theme>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:12px;height:12px"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></svg>
          Theme
        </button>
      </div>
    </div>

    <div class="cmd-results" id="cmd-results"></div>

    <div class="cmd-footer">
      <span>↑ ↓ navigate · ↵ open</span>
      <span>QuickVault</span>
    </div>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
